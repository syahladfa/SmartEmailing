.r2-tt small { color: var(--muted); font-size: .78rem; }
.r2-tt small b { color: var(--maroon); }
.r2-prog { flex: 1 1 160px; max-width: 340px; display: flex; align-items: center; gap: .6rem; }
.r2-bar { flex: 1; height: 8px; border-radius: 99px; background: var(--sand); overflow: hidden; }
.r2-bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--maroon), var(--gold-l)); transition: width .8s var(--ease); }
.r2-prog > b { font-size: .82rem; color: var(--maroon); min-width: 2.6em; }
.r2-act { margin-left: auto; display: flex; gap: .5rem; align-items: center; }
.r2-act .rail-all { margin-left: 0; }
.r2-go { display: inline-flex; align-items: center; gap: .35rem; font-size: .8rem; font-weight: 700; text-decoration: none; color: var(--maroon-3); background: var(--gold-l); padding: .45em .9em; border-radius: 10px; box-shadow: 0 6px 14px -8px rgba(122, 31, 46, .7); transition: transform .2s var(--ease), box-shadow .2s; }
.r2-go:hover { transform: translateY(-2px); box-shadow: 0 10px 18px -10px rgba(122, 31, 46, .8); }
.r2-go .ic { width: .9rem; height: .9rem; }
.r2-go .ic .f { display: none; }

.r2-track { position: relative; display: flex; overflow-x: auto; overflow-y: visible; padding: .2rem .1rem .3rem; scrollbar-width: thin; scroll-behavior: smooth; }
.r2-grp { flex: calc(var(--n) + .7) 1 0; min-width: max(118px, calc(var(--n) * 66px)); position: relative; padding: 0 .1rem; }
.r2-grp + .r2-grp { border-left: 1px dashed var(--line); }
.r2-gh { display: flex; align-items: center; justify-content: space-between; gap: .4rem; padding: .25rem .6rem .5rem; }
.r2-gh b { font-size: .66rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--maroon-2); white-space: nowrap; }
.r2-gh span { display: inline-flex; align-items: center; gap: .2rem; font-size: .68rem; font-weight: 700; color: var(--muted); background: var(--paper); padding: .1em .5em; border-radius: 99px; }
.r2-gh .ic { width: .75rem; height: .75rem; }
.r2-gh .ic .f { display: none; }
.r2-grp.full .r2-gh span { background: var(--ok-bg); color: var(--ok); }
.r2-grp.go .r2-gh span { background: var(--gold-s); color: var(--maroon); }
.r2-grp.lock .r2-gh b { color: var(--muted); }

.r2-stops { position: relative; display: grid; grid-template-columns: repeat(var(--n), 1fr); }
.r2-stops::before, .r2-stops::after { content: ''; position: absolute; left: 0; top: 19px; height: 4px; border-radius: 4px; }
.r2-stops::before { right: 0; background: var(--sand); }
.r2-stops::after { width: var(--fill); background: linear-gradient(90deg, var(--maroon), var(--gold)); transition: width .9s var(--ease); }
.r2-stop { position: relative; z-index: 1; display: grid; justify-items: center; gap: .35rem; text-decoration: none; padding-bottom: .1rem; outline: none; animation: r2In .5s var(--ease) both; animation-delay: calc(var(--i) * 35ms); }
@keyframes r2In { from { opacity: 0; transform: translateY(8px) scale(.85); } }
.r2-dot { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: var(--maroon); border: 2.5px solid var(--maroon); font-size: .8rem; box-shadow: 0 0 0 4px var(--card); transition: transform .25s cubic-bezier(.3, 1.5, .5, 1), box-shadow .25s, background .25s; }
.r2-dot b { font-weight: 800; }
.r2-dot .ic { width: 1rem; height: 1rem; }
.r2-dot .ic .f { display: none; }
.r2-lbl { font-size: .68rem; font-weight: 700; color: var(--muted); letter-spacing: .02em; white-space: nowrap; }
.r2-stop:hover .r2-dot, .r2-stop:focus-visible .r2-dot { transform: translateY(-3px) scale(1.08); box-shadow: 0 0 0 4px var(--card), 0 10px 18px -8px rgba(59, 17, 25, .55); }
.r2-stop:focus-visible .r2-dot { box-shadow: 0 0 0 4px var(--card), 0 0 0 7px var(--gold); }
.r2-stop.done .r2-dot { background: var(--maroon); color: var(--gold-s); border-color: var(--maroon); }
.r2-stop.done .r2-lbl { color: var(--maroon); }
.r2-stop.locked .r2-dot { background: var(--sand); color: #8a7476; border: 2px solid #e2cfb0; }
.r2-stop.locked:hover .r2-dot { transform: translateY(-2px); animation: r2Shake .4s; }
@keyframes r2Shake { 25% { rotate: -8deg; } 75% { rotate: 8deg; } }
.r2-stop.cur .r2-dot { width: 48px; height: 48px; margin-top: -3px; margin-bottom: -3px; background: var(--gold-l); color: var(--maroon-3); border: 3px solid var(--maroon-2); animation: r2Pulse 2s ease-in-out infinite; }
.r2-stop.cur.is-done .r2-dot { background: var(--maroon); color: var(--gold-s); }
.r2-stop.cur .r2-lbl { color: #fff; background: var(--maroon); padding: .1em .55em; border-radius: 99px; }
@keyframes r2Pulse { 0%, 100% { box-shadow: 0 0 0 4px var(--card), 0 0 0 4px rgba(226, 176, 74, .55); } 50% { box-shadow: 0 0 0 4px var(--card), 0 0 0 12px rgba(226, 176, 74, 0); } }
body.settled .r2-stop { animation: none; }
@media (prefers-reduced-motion: reduce) { .r2-stop, .r2-stop.cur .r2-dot { animation: none; } }
@media (max-width: 760px) {
  .r2 { padding: .85rem .8rem .9rem; }
  .r2-head { gap: .6rem; margin-bottom: .7rem; }
  .r2-prog { order: 5; flex-basis: 100%; max-width: none; }
  .r2-act .rail-all span { display: none; }
  .r2-grp { min-width: max(104px, calc(var(--n) * 58px)); }
  .r2-dot { width: 36px; height: 36px; }
  .r2-stops::before, .r2-stops::after { top: 16px; }
  .r2-stop.cur .r2-dot { width: 42px; height: 42px; }
}

/* ---------- Pop-up petunjuk (hint) ---------- */
.hint { position: fixed; right: 20px; bottom: 20px; z-index: 85; width: min(360px, calc(100vw - 24px)); display: flex; gap: .8rem; align-items: flex-start; padding: .95rem 1rem 1rem; border-radius: 18px; background: var(--card); color: var(--ink); border: 1px solid rgba(92, 21, 34, .16); border-left: 5px solid var(--gold-l); box-shadow: 0 22px 50px -18px rgba(36, 10, 16, .55); opacity: 0; transform: translateY(18px) scale(.96); transition: opacity .3s, transform .35s cubic-bezier(.3, 1.4, .5, 1); }
.hint.show { opacity: 1; transform: none; }
.hint-ic { flex: none; width: 2.6rem; height: 2.6rem; border-radius: 50%; display: grid; place-items: center; background: var(--gold-l); color: var(--maroon-3); box-shadow: 0 0 0 0 rgba(226, 176, 74, .6); animation: hintGlow 1.8s ease-in-out infinite; }
.hint-ic .ic { width: 1.3rem; height: 1.3rem; }
.hint-ic .ic .f { display: none; }
@keyframes hintGlow { 50% { box-shadow: 0 0 0 9px rgba(226, 176, 74, 0); transform: rotate(-8deg); } }
.hint-b { flex: 1; min-width: 0; }
.hint-b small { font-size: .7rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.hint-b p { margin: .15rem 0 .7rem; font-size: .9rem; line-height: 1.5; color: var(--ink); }
.hint-b p b { color: var(--maroon); }
.hint-btns { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.hint-x { border: 0; background: none; color: var(--muted); font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer; padding: .3rem .2rem; }
.hint-x:hover { color: var(--maroon); }
.hint-spot { position: relative; animation: hintSpot 2.4s ease-out; border-radius: 16px; }
@keyframes hintSpot { 0% { box-shadow: 0 0 0 0 rgba(226, 176, 74, .9); } 15% { box-shadow: 0 0 0 4px var(--gold-l), 0 0 0 14px rgba(226, 176, 74, .35); transform: scale(1.04); } 30% { transform: scale(1); } 45% { transform: scale(1.03); } 60% { box-shadow: 0 0 0 4px var(--gold-l), 0 0 0 14px rgba(226, 176, 74, .35); transform: none; } 100% { box-shadow: 0 0 0 0 rgba(226, 176, 74, 0); } }
@media (max-width: 760px) { .hint { right: 12px; left: 12px; width: auto; bottom: 92px; } }
@media (prefers-reduced-motion: reduce) { .hint-ic, .hint-spot { animation: none; } .hint-spot { outline: 3px solid var(--gold-l); outline-offset: 3px; } }

/* ---------- Seret & letakkan (slots): evaluasi E1, aktivitas A dan B ---------- */
.dz { display: grid; gap: 1rem; }
.dz-pool { display: flex; flex-wrap: wrap; gap: .5rem; min-height: 3rem; padding: .75rem; border-radius: 14px; background: var(--paper); border: 1.5px dashed rgba(201, 149, 46, .6); }
.dz-pool.over { background: var(--gold-s); }
.dz-card { display: inline-flex; align-items: center; padding: .55rem .85rem; border-radius: 10px; background: #fff; color: var(--maroon-2); border: 1.5px solid var(--line); font: inherit; font-size: .9rem; font-weight: 600; line-height: 1.35; text-align: left; cursor: grab; box-shadow: 0 4px 10px -6px rgba(59, 17, 25, .4); transition: transform .2s var(--ease), box-shadow .2s, border-color .2s; }
.dz-card:hover { transform: translateY(-2px); border-color: var(--gold); }
.dz-card.on { border-color: var(--maroon); background: var(--gold-s); transform: translateY(-2px) scale(1.02); box-shadow: 0 0 0 3px rgba(226, 176, 74, .45); }
.dz-card.drag { opacity: .45; }
.dz-slots { list-style: none; margin: 0; padding: 0; display: grid; gap: .55rem; }
.dz-slot { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); align-items: center; gap: .8rem; padding: .55rem .7rem; border-radius: 12px; background: var(--card); border: 1.5px solid var(--line); transition: background .2s, border-color .2s; }
.dz-slot.over { background: var(--gold-s); border-color: var(--gold); }
.dz-lb { font-size: .88rem; color: var(--ink); line-height: 1.4; }
.dz-in { min-height: 2.6rem; display: flex; align-items: center; padding: .25rem; border-radius: 10px; border: 1.5px dashed rgba(201, 149, 46, .55); background: #fff; cursor: pointer; }
.dz-in i { color: var(--muted); font-size: .8rem; padding: 0 .4rem; }
.dz-slot.full .dz-in { border-style: solid; border-color: transparent; background: transparent; }
.dz-card.in { width: 100%; cursor: pointer; }
.dz-slot.ok { background: var(--ok-bg); border-color: rgba(47, 111, 78, .45); }
.dz-slot.no { background: var(--bad-bg); border-color: rgba(179, 65, 47, .4); }
.dz.lock .dz-card { cursor: default; }
@media (max-width: 640px) { .dz-slot { grid-template-columns: 1fr; gap: .4rem; } }

/* ---------- Bagian hasil latihan ---------- */
.lat-done { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 1.1rem; padding: 1rem 1.2rem; margin-bottom: 1rem; border-radius: 16px; background: var(--ok-bg); border: 1px solid rgba(47, 111, 78, .3); animation: popIn .4s var(--ease); }
.lat-done.no { background: var(--bad-bg); border-color: rgba(179, 65, 47, .3); }
.ld-score { display: grid; place-items: center; width: 4.6rem; height: 4.6rem; border-radius: 50%; background: #fff; text-align: center; line-height: 1.1; }
.ld-score b { font-size: 1.6rem; color: var(--maroon-2); }
.ld-score small { font-size: .62rem; color: var(--muted); }
.ld-txt p { margin: .35rem 0 0; font-size: .9rem; }
.ld-btns { display: flex; gap: .5rem; flex-wrap: wrap; }
@media (max-width: 640px) { .lat-done { grid-template-columns: auto 1fr; } .ld-btns { grid-column: 1 / -1; } }

/* ---------- Bagian aktivitas interaktif ---------- */
.akt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: .9rem; margin: .8rem 0; }
.akt-card { position: relative; display: grid; gap: .3rem; justify-items: start; text-align: left; padding: 1.1rem 1.1rem 1rem; border-radius: 18px; background: var(--card); border: 1.5px solid var(--line); color: var(--ink); font: inherit; cursor: pointer; box-shadow: var(--shadow); transition: transform .25s var(--ease), box-shadow .25s, border-color .25s; }
.akt-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--gold); }
.akt-card b { color: var(--maroon-2); font-size: 1.02rem; }
.akt-card small { color: var(--muted); font-size: .84rem; line-height: 1.45; }
.akt-l { position: absolute; top: .9rem; right: .9rem; display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: 50%; background: var(--sand); color: var(--maroon); font-weight: 800; }
.akt-l .ic { width: 1rem; height: 1rem; }
.akt-ic { display: grid; place-items: center; width: 2.6rem; height: 2.6rem; border-radius: 12px; background: var(--gold-s); color: var(--maroon); margin-bottom: .3rem; }
.akt-st { margin-top: .4rem; font-size: .74rem; font-weight: 700; color: var(--maroon); background: var(--paper); padding: .2em .65em; border-radius: 99px; }
.akt-card.done { border-color: rgba(47, 111, 78, .45); }
.akt-card.done .akt-l { background: var(--ok); color: #fff; }
.akt-card.done .akt-st { background: var(--ok-bg); color: var(--ok); }
.akt-sum { display: flex; align-items: center; gap: .4rem; font-weight: 700; color: var(--maroon); font-size: .9rem; }
.akt-frame { animation: popIn .35s var(--ease); }
.akt-top { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; margin-bottom: 1rem; }
.akt-top b { color: var(--maroon-2); }
.akt-end { display: grid; justify-items: center; text-align: center; gap: .4rem; padding: 1.2rem 0; }
.akt-end > .ic { width: 2.6rem; height: 2.6rem; color: var(--ok); }
.akt-end h3 { margin: 0; color: var(--maroon-2); }
.fix-line { display: flex; flex-wrap: wrap; gap: .4rem; padding: 1rem; border-radius: 14px; background: #fff; border: 1px solid var(--line); margin-bottom: .9rem; }
.fix-seg { padding: .45rem .7rem; border-radius: 9px; border: 1.5px dashed rgba(201, 149, 46, .7); background: var(--paper); color: var(--ink); font: inherit; font-size: .95rem; cursor: pointer; transition: background .2s, border-color .2s; }
.fix-seg:hover:not(:disabled) { background: var(--gold-s); border-color: var(--gold); }
.fix-seg:disabled { cursor: default; opacity: 1; }
.fix-seg.bad { background: var(--bad-bg); border: 1.5px solid var(--bad); color: var(--bad); text-decoration: line-through; }
.fix-seg.fixed { background: var(--ok-bg); border: 1.5px solid var(--ok); color: var(--ok); font-weight: 600; }
.opt.no { border-color: var(--bad); background: var(--bad-bg); }

/* ---------- Bagian gerbang evaluasi ---------- */
.gate { display: grid; gap: .7rem; }
.gate-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .9rem; padding: .9rem 1rem; border-radius: 14px; background: var(--paper); border: 1.5px solid var(--line); animation: popIn .45s var(--ease) both; animation-delay: calc(var(--i) * 180ms); }
.gate-row b { display: block; color: var(--maroon-2); font-size: .95rem; line-height: 1.35; }
.gate-row small { color: var(--muted); font-size: .82rem; }
.gate-ic { display: grid; place-items: center; width: 2.4rem; height: 2.4rem; border-radius: 50%; background: var(--sand); color: var(--muted); }
.gate-ic .ic { width: 1.1rem; height: 1.1rem; }
.gate-ic .ic .f { display: none; }
.gate-row.ok { background: var(--ok-bg); border-color: rgba(47, 111, 78, .35); }
.gate-row.ok .gate-ic { background: var(--ok); color: #fff; }
.gate-ok { font-size: .78rem; font-weight: 700; color: var(--ok); }
.gate-go { display: grid; justify-items: center; gap: .4rem; margin-top: .8rem; }
.gate-go button:disabled { opacity: .55; cursor: not-allowed; }
@media (max-width: 640px) { .gate-row { grid-template-columns: auto 1fr; } .gate-row > :last-child { grid-column: 2; justify-self: start; } }
body.settled .gate-row { animation: none; }

.goal-list { margin: .3rem 0 .6rem; padding-left: 1.2rem; }
.goal-list li { margin: .15rem 0; }
.opt.picked.ok { border-color: var(--ok); background: var(--ok-bg); }
.opt.picked.ok .opt-l { background: var(--ok); color: #fff; }
.opt.picked.no { border-color: var(--bad); background: var(--bad-bg); }
.opt.picked.no .opt-l { background: var(--bad); color: #fff; }
.dz-num .dz-slot { grid-template-columns: auto minmax(0, 1fr); }
.dz-num .dz-lb { min-width: 2.2rem; text-align: center; font-weight: 800; color: var(--maroon); background: var(--gold-s); border-radius: 8px; padding: .3rem .5rem; }
@media (max-width: 640px) { .dz-num .dz-slot { grid-template-columns: auto minmax(0, 1fr); } }

/* =========================================================================
   LMS: menu samping, dashboard, latihan, progres, pengaturan
   ========================================================================= */
/* ---------- Kerangka halaman LMS ---------- */
.lms { display: grid; gap: 1.1rem; align-content: start; }
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1rem; }
.ph h1 { margin: .1rem 0 .2rem; font-size: clamp(1.5rem, 2.6vw, 2rem); color: var(--maroon-2); letter-spacing: -.02em; line-height: 1.15; }
.ph p { margin: 0; color: var(--muted); max-width: 60ch; }
.ph-k { font-size: .72rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.ph-sum { display: flex; gap: .6rem; flex-wrap: wrap; }
.ph-sum > div { min-width: 6.5rem; padding: .6rem .9rem; border-radius: 14px; background: var(--card); border: 1px solid var(--line); display: grid; }
.ph-sum b { font-size: 1.2rem; color: var(--maroon-2); line-height: 1.2; display: flex; align-items: center; }
.ph-sum b .ic { width: 1.2rem; height: 1.2rem; color: var(--ok); }
.ph-sum small { font-size: .74rem; color: var(--muted); }
.ph-sum > div.ok { background: var(--ok-bg); border-color: rgba(47, 111, 78, .3); }
.sec-h { margin: .4rem 0 0; font-size: 1.05rem; color: var(--maroon-2); display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
.sec-h small { font-size: .8rem; font-weight: 500; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 1.1rem 1.2rem; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: .6rem; margin-bottom: .7rem; }
.card-h h2 { margin: 0; font-size: 1rem; color: var(--maroon-2); }
.card-h a { display: inline-flex; align-items: center; gap: .25rem; font-size: .8rem; font-weight: 700; color: var(--maroon); text-decoration: none; }
.card-h a .ic { width: .9rem; height: .9rem; }
.empty { display: grid; justify-items: center; text-align: center; gap: .35rem; padding: 2rem 1rem; color: var(--muted); }
.empty > .ic { width: 2.4rem; height: 2.4rem; color: var(--gold); }
.empty h3 { margin: .2rem 0 0; color: var(--maroon-2); font-size: 1rem; }
.empty p { margin: 0 0 .6rem; max-width: 40ch; font-size: .88rem; }
.empty.sm { padding: 1rem .5rem; }
.note-lock { display: flex; align-items: center; gap: .9rem; flex-wrap: wrap; padding: .9rem 1rem; border-radius: 16px; background: var(--info-bg); border: 1px solid rgba(201, 149, 46, .4); }
.note-lock > .ic { width: 1.6rem; height: 1.6rem; color: var(--maroon); flex: none; }
.note-lock div { flex: 1; min-width: 12rem; }
.note-lock p { margin: .1rem 0 0; font-size: .86rem; color: var(--muted); }
.ex-st { display: inline-flex; align-items: center; padding: .15em .6em; border-radius: 99px; font-size: .7rem; font-weight: 700; background: var(--sand); color: var(--muted); white-space: nowrap; }
.ex-st.go { background: var(--gold-s); color: var(--maroon); }
.ex-st.done { background: var(--ok-bg); color: var(--ok); }

/* ---------- Dashboard ---------- */
.dstat:nth-child(2) { animation-delay: .05s; } .dstat:nth-child(3) { animation-delay: .1s; } .dstat:nth-child(4) { animation-delay: .15s; } .dstat:nth-child(5) { animation-delay: .2s; }
.cl-t { margin: .2rem 0 .1rem; font-size: 1.15rem; color: var(--maroon-2); }
.cl-sub { margin: 0 0 .7rem; color: var(--muted); font-size: .86rem; }
.cl-prog { display: flex; align-items: center; gap: .7rem; }
.cl-prog .bar { flex: 1; }
.cl-prog b { font-size: .85rem; color: var(--maroon); }
.cl-hint { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; margin: .6rem 0 0; font-size: .82rem; color: var(--muted); }
.acts { list-style: none; margin: 0; padding: 0; display: grid; gap: .1rem; }
.acts li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: .7rem; padding: .5rem .3rem; border-bottom: 1px dashed var(--line); animation: popIn .35s var(--ease) both; }
.acts li:last-child { border-bottom: 0; }
.acts a { color: var(--ink); text-decoration: none; font-size: .87rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acts a:hover { color: var(--maroon); text-decoration: underline; }
.acts time { font-size: .74rem; color: var(--muted); white-space: nowrap; }
.act-ic { display: grid; place-items: center; width: 1.9rem; height: 1.9rem; border-radius: 50%; background: var(--paper); color: var(--maroon); }
.act-ic .ic { width: .95rem; height: .95rem; }
.acts .act-done .act-ic { background: var(--ok-bg); color: var(--ok); }
.acts .act-lat .act-ic, .acts .act-akt .act-ic { background: var(--gold-s); }
.acts .act-ev .act-ic { background: var(--maroon); color: var(--cream); }

/* ---------- Kartu latihan ---------- */
.ex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: .9rem; }
.ex-card { display: grid; gap: .35rem; align-content: start; padding: 1rem 1.05rem; border-radius: 18px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); transition: transform .25s var(--ease), box-shadow .25s, border-color .25s; animation: popIn .4s var(--ease) both; }
.ex-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: rgba(201, 149, 46, .55); }
.ex-card.done { border-color: rgba(47, 111, 78, .35); }
.ex-card.locked { opacity: .75; }
.ex-card.locked:hover { transform: none; }
.ex-top { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.ex-no { display: grid; place-items: center; min-width: 2.3rem; height: 2.3rem; padding: 0 .4rem; border-radius: 11px; background: var(--gold-s); color: var(--maroon); font-weight: 800; font-size: .85rem; }
.ex-no .ic { width: 1.15rem; height: 1.15rem; }
.ex-card h3 { margin: .3rem 0 0; font-size: 1rem; color: var(--maroon-2); line-height: 1.3; }
.ex-topik { color: var(--muted); font-size: .82rem; line-height: 1.4; }
.ex-meta { display: flex; flex-wrap: wrap; gap: .3rem .9rem; font-size: .78rem; color: var(--muted); margin-top: .2rem; }
.ex-meta span { display: inline-flex; align-items: center; gap: .3rem; }
.ex-meta .ic { width: .85rem; height: .85rem; }
.ex-prog { display: flex; align-items: center; gap: .6rem; }
.ex-prog .bar { flex: 1; }
.ex-prog b { font-size: .78rem; color: var(--maroon); }
.ex-cta { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .45rem; }
.ex-cta [aria-disabled="true"] { pointer-events: none; opacity: .7; }

/* ---------- Layar kuis ---------- */
.quiz { max-width: 860px !important; margin: 0 auto; padding-top: 1rem; padding-bottom: 2rem; display: grid; gap: .9rem; }
.qz-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 1rem; }
.qz-x { display: inline-flex; align-items: center; gap: .35rem; padding: .45rem .8rem; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--maroon); font-weight: 700; font-size: .84rem; text-decoration: none; }
.qz-x:hover { background: var(--gold-s); }
.qz-t { display: grid; min-width: 0; line-height: 1.25; }
.qz-t b { color: var(--maroon-2); font-size: 1.05rem; }
.qz-t small { color: var(--muted); font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qz-count { font-size: .85rem; color: var(--muted); white-space: nowrap; }
.qz-count b { color: var(--maroon); font-size: 1.05rem; }
.qz-bar { height: 8px; border-radius: 99px; background: var(--sand); overflow: hidden; }
.qz-bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--maroon), var(--gold-l)); transition: width .5s var(--ease); }
.qz-nav { display: flex; flex-wrap: wrap; gap: .4rem; }
.qz-nav button { width: 2.4rem; height: 2.4rem; border-radius: 12px; border: 1.5px dashed rgba(201, 149, 46, .7); background: #fff; color: var(--maroon); font: inherit; font-weight: 800; font-size: .85rem; cursor: pointer; transition: transform .2s var(--ease), background .2s, border-color .2s; }
.qz-nav button:hover { transform: translateY(-2px); }
.qz-nav button.picked { border-style: solid; background: var(--gold-s); }
.qz-nav button.ok { border: 1.5px solid var(--ok); background: var(--ok-bg); color: var(--ok); }
.qz-nav button.no { border: 1.5px solid var(--bad); background: var(--bad-bg); color: var(--bad); }
.qz-nav button.cur { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--maroon); }
.qz-card { padding: 1.3rem 1.4rem; border-radius: 20px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-lg); min-height: 20rem; }
.qz-card .q { font-size: 1.12rem; font-weight: 600; color: var(--ink); margin: .7rem 0 1rem; line-height: 1.5; }
.qz-rel { display: inline-flex; align-items: center; gap: .4rem; margin-top: .7rem; font-size: .84rem; font-weight: 600; color: var(--maroon); text-decoration: none; }
.qz-rel:hover { text-decoration: underline; }
.qz-rel .ic { width: .95rem; height: .95rem; }
.qz-foot { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .6rem; }
.qz-main { display: flex; justify-content: center; gap: .6rem; flex-wrap: wrap; }
@media (max-width: 640px) {
  .qz-head { grid-template-columns: auto minmax(0, 1fr); }
  .qz-count { grid-column: 1 / -1; }
  .qz-x span { display: none; }
  .qz-foot { grid-template-columns: 1fr 1fr; }
  .qz-main { grid-column: 1 / -1; grid-row: 1; }
  .qz-card { padding: 1rem; }
}

/* ---------- Hasil dan review ---------- */
.res { display: grid; grid-template-columns: auto 1fr; gap: 2rem; align-items: center; padding: 1.6rem 1.8rem; border-radius: 22px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-lg); animation: popIn .45s var(--ease); }
.res h1 { margin: .2rem 0 .3rem; color: var(--maroon-2); font-size: clamp(1.4rem, 2.4vw, 1.9rem); }
.res p { margin: 0 0 .6rem; }
.res.ok .ring { background: radial-gradient(closest-side, var(--card) 79%, transparent 80% 100%), conic-gradient(var(--ok) calc(var(--p) * 1%), var(--sand) 0); }
.res-stats { display: flex; flex-wrap: wrap; gap: .5rem; margin: .4rem 0 .8rem; }
.res-stats > div { display: grid; min-width: 5rem; padding: .5rem .8rem; border-radius: 12px; background: var(--paper); }
.res-stats b { font-size: 1.15rem; color: var(--maroon-2); }
.res-stats small { font-size: .72rem; color: var(--muted); }
.res-stats .ok { background: var(--ok-bg); } .res-stats .ok b { color: var(--ok); }
.res-stats .no { background: var(--bad-bg); } .res-stats .no b { color: var(--bad); }
.res-dots { display: flex; gap: .35rem; margin-bottom: .6rem; }
.res-dots span { display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: 10px; font-size: .78rem; font-weight: 800; }
.res-dots .ok { background: var(--ok-bg); color: var(--ok); }
.res-dots .no { background: var(--bad-bg); color: var(--bad); }
@media (max-width: 700px) { .res { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 1.2rem; } .res-stats, .res-dots, .res .row-btns { justify-content: center; } }
.rv { list-style: none; margin: 0; padding: 0; display: grid; gap: .8rem; }
.rv-item { padding: 1rem 1.1rem; border-radius: 16px; background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--ok); box-shadow: var(--shadow); }
.rv-item.no { border-left-color: var(--bad); }
.rv-h { display: grid; grid-template-columns: auto 1fr auto; gap: .7rem; align-items: start; margin-bottom: .4rem; }
.rv-h b { color: var(--maroon-2); line-height: 1.45; }
.rv-n { display: grid; place-items: center; width: 1.8rem; height: 1.8rem; border-radius: 9px; background: var(--paper); color: var(--maroon); font-weight: 800; font-size: .8rem; }
.rv-item p { margin: .25rem 0 0 2.5rem; font-size: .9rem; }
.rv-item p small { display: inline-block; min-width: 7.5rem; color: var(--muted); font-size: .76rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.rv-why { color: var(--muted); }
.rv-why a { display: inline-flex; align-items: center; gap: .2rem; color: var(--maroon); font-weight: 600; text-decoration: none; }
.rv-why a .ic { width: .85rem; height: .85rem; }
@media (max-width: 640px) { .rv-item p { margin-left: 0; } .rv-h { grid-template-columns: auto 1fr; } .rv-h .badge { grid-column: 2; justify-self: start; } }

/* ---------- Progres ---------- */
.pg-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .9rem; }
.pg-row { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; align-items: center; gap: .8rem; padding: .5rem .3rem; border-bottom: 1px dashed var(--line); color: var(--ink); text-decoration: none; border-radius: 8px; transition: background .2s; }
.pg-row:hover { background: var(--paper); }
.pg-row:last-child { border-bottom: 0; }
.pg-t { display: grid; min-width: 0; font-size: .88rem; line-height: 1.3; }
.pg-t b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pg-t small { color: var(--muted); font-size: .74rem; }
.pg-n { font-size: .8rem; color: var(--maroon); min-width: 2.6rem; text-align: right; }
.pg-ev { display: flex; align-items: center; gap: .5rem; margin: .7rem 0 0; font-size: .86rem; color: var(--muted); }
.pg-ach { margin-top: .3rem; }
.pg-ach .h2:first-child { margin-top: 0; }
@media (max-width: 860px) { .pg-grid { grid-template-columns: 1fr; } }

/* ---------- Pengaturan ---------- */
.set { max-width: 820px !important; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .75rem .2rem; border-bottom: 1px dashed var(--line); cursor: pointer; }
.set-row:last-child { border-bottom: 0; }
.set-row > span { display: grid; gap: .1rem; }
.set-row b { color: var(--maroon-2); font-size: .93rem; }
.set-row small { color: var(--muted); font-size: .8rem; }
.set-row.col { flex-direction: column; align-items: stretch; cursor: default; }
.set-row input[type="text"] { font: inherit; padding: .65rem .8rem; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); }
.set-row input[type="text"]:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-s); }
.switch { appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 2.9rem; height: 1.65rem; border-radius: 99px; background: var(--sand); border: 1px solid var(--line); cursor: pointer; transition: background .25s; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: calc(1.65rem - 6px); height: calc(1.65rem - 6px); border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(36, 10, 16, .25); transition: transform .25s var(--ease); }
.switch:checked { background: var(--maroon); }
.switch:checked::after { transform: translateX(1.25rem); }
.btn.danger { color: var(--bad); border-color: rgba(179, 65, 47, .4); }
.btn.danger:hover { background: var(--bad-bg); }

@media (prefers-reduced-motion: reduce) { .sb, body { transition: none; } .ex-card, .acts li, .res { animation: none; } }
body.settled .ex-card, body.settled .acts li { animation: none; }

:root { --f-display: 'Anton', Impact, 'Arial Narrow', sans-serif; --f-head: 'Bricolage Grotesque', 'Poppins', system-ui, sans-serif; --f-body: 'DM Sans', 'Poppins', system-ui, sans-serif; --sb-bg: #2a0b12; --sb-bg2: #3b1119; }
body { font-family: var(--f-head); font-weight: 500; }
p, li, dd, td, .muted, .lead-s, input, textarea, select, .bubble { font-family: var(--f-body); font-weight: 400; }
.display, .ph h1, .res h1, .ev-result h3 { font-family: var(--f-display); font-weight: 400; letter-spacing: .01em; line-height: 1.05; }

/* ---------- Menu samping (gaya GrowthLab, warna Smart Emailing) ---------- */
:root { --sbw: 264px; }
body.sb-mini-on { --sbw: 88px; }
body.focus-mode { --sbw: 0px; }
@media (min-width: 861px) { body { padding-left: var(--sbw); transition: padding-left .3s var(--ease); } }
.sb { position: fixed; z-index: 40; left: 0; top: 0; bottom: 0; width: var(--sbw); display: flex; flex-direction: column; gap: .5rem; padding: 1rem .8rem .9rem; color: rgba(251, 245, 236, .82); background: radial-gradient(rgba(251, 245, 236, .05) 1px, transparent 1.2px) 0 0 / 18px 18px, linear-gradient(180deg, var(--sb-bg2), var(--sb-bg)); border-right: 1px solid rgba(251, 245, 236, .06); overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; scrollbar-color: rgba(251, 245, 236, .15) transparent; transition: width .3s var(--ease), transform .35s var(--ease); }
.sb-top { display: flex; align-items: center; gap: .5rem; padding: .1rem .2rem .7rem; }
.sb-brand { display: flex; align-items: center; gap: .6rem; text-decoration: none; min-width: 0; flex: 1; }
.sb-brand .brand-mark { width: 2.4rem; height: 2.4rem; }
.sb-word { font-family: var(--f-display); font-size: 1.35rem; letter-spacing: .02em; color: var(--cream); white-space: nowrap; }
.sb-word em { font-style: normal; color: var(--gold-l); }
.sb-mini { flex: none; display: grid; place-items: center; width: 2.1rem; height: 2.1rem; border: 0; border-radius: 9px; background: rgba(251, 245, 236, .07); color: rgba(251, 245, 236, .7); cursor: pointer; transition: background .2s, color .2s; }
.sb-mini:hover { background: rgba(251, 245, 236, .14); color: var(--cream); }
.sb-mini .ic { width: 1.05rem; height: 1.05rem; }
.sb-nav { display: grid; gap: .2rem; align-content: start; }
.sb-nav a, .sb-gh { position: relative; display: flex; align-items: center; gap: .75rem; min-height: 2.75rem; padding: .3rem .55rem; border-radius: 13px; color: rgba(251, 245, 236, .86); text-decoration: none; font: 600 .95rem/1.2 var(--f-head); white-space: nowrap; border: 0; background: none; cursor: pointer; text-align: left; width: 100%; transition: background .2s, color .2s, transform .2s var(--ease); }
.sb-nav a:hover, .sb-gh:hover { background: rgba(251, 245, 236, .07); color: #fff; transform: translateX(2px); }
.sb .t-ic { flex: none; display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: 9px; background: var(--tc, rgba(251, 245, 236, .1)); color: #fff; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .18); --icf: rgba(255, 255, 255, .35); transition: transform .3s cubic-bezier(.3, 1.6, .5, 1); }
.sb .t-ic .ic { width: 1.1rem; height: 1.1rem; stroke-width: 2.1; }
.sb-nav a:hover .t-ic, .sb-gh:hover .t-ic { transform: rotate(-6deg) scale(1.06); }
.sb-nav a.active { background: var(--cream); color: var(--maroon-3); transform: none; box-shadow: 0 10px 22px -14px rgba(0, 0, 0, .6); }
.sb-nav a.active::before { content: ''; position: absolute; left: -.8rem; top: .55rem; bottom: .55rem; width: 4px; border-radius: 0 4px 4px 0; background: var(--gold-l); }
.sb-count { margin-left: auto; font: 700 .72rem/1 var(--f-head); padding: .3em .55em; border-radius: 99px; background: rgba(251, 245, 236, .1); color: rgba(251, 245, 236, .8); }
.sb-nav a.active .sb-count { background: rgba(92, 21, 34, .1); color: var(--maroon); }
.sb .tbadge { margin-left: auto; }
.sb-grp { border-top: 1px solid rgba(251, 245, 236, .08); padding-top: .3rem; margin-top: .3rem; }
.sb-gh { color: rgba(251, 245, 236, .62); }
.sb-grp.has-active .sb-gh, .sb-grp.open .sb-gh { color: rgba(251, 245, 236, .9); }
.sb-chev { margin-left: auto; display: grid; transition: transform .3s var(--ease); }
.sb-chev .ic { width: .95rem; height: .95rem; }
.sb-grp.open .sb-chev { transform: rotate(180deg); }
.sb-sub { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s var(--ease); }
.sb-grp.open .sb-sub { grid-template-rows: 1fr; }
.sb-sub > div { overflow: hidden; display: grid; gap: .1rem; margin-left: 1.5rem; padding-left: .55rem; border-left: 1px solid rgba(251, 245, 236, .12); }
.sb-sub a { min-height: 2.4rem; font-size: .9rem; }
.sb-sub .t-ic { width: 1.75rem; height: 1.75rem; border-radius: 8px; }
.sb-sub .t-ic .ic { width: .95rem; height: .95rem; }
.sb-sub a.active::before { left: -.65rem; }
.sb-journey { margin-top: auto; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: .65rem; padding: .7rem .75rem; border-radius: 16px; background: rgba(251, 245, 236, .07); border: 1px solid rgba(251, 245, 236, .1); color: var(--cream); text-decoration: none; transition: background .2s, transform .2s var(--ease); }
.sb-journey:hover { background: rgba(251, 245, 236, .12); transform: translateY(-2px); }
.sbj-m { width: 2.4rem; display: block; }
.sbj-m .pix { width: 100%; height: auto; display: block; animation: bob 2.8s ease-in-out infinite; }
.sbj-t { display: grid; gap: .15rem; min-width: 0; }
.sbj-t b { font-size: .86rem; }
.sbj-t small { font: 500 .72rem/1.2 var(--f-head); color: rgba(251, 245, 236, .6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sbj-bar { height: 6px; border-radius: 99px; background: rgba(251, 245, 236, .14); overflow: hidden; margin-top: .15rem; }
.sbj-bar i { display: block; height: 100%; border-radius: inherit; background: var(--gold-l); transition: width .8s var(--ease); }
.sbj-p { font: 700 .8rem/1 var(--f-head); color: var(--gold-l); }
@keyframes bob { 50% { transform: translateY(-3px); } }
/* menu ringkas: ikon saja + tooltip */
.sb-mini-on .sb .t-l, .sb-mini-on .sb .sb-word, .sb-mini-on .sb .sb-count, .sb-mini-on .sb .tbadge, .sb-mini-on .sb .sb-chev, .sb-mini-on .sbj-t, .sb-mini-on .sbj-p { display: none; }
.sb-mini-on .sb { overflow: visible; padding-left: .6rem; padding-right: .6rem; }
.sb-mini-on .sb-top { flex-direction: column; }
.sb-mini-on .sb-mini .ic { transform: scaleX(-1); }
.sb-mini-on .sb-nav a, .sb-mini-on .sb-gh { justify-content: center; padding: .3rem 0; }
.sb-mini-on .sb-sub > div { margin-left: 0; padding-left: 0; border-left: 0; }
.sb-mini-on .sb-journey { grid-template-columns: 1fr; justify-items: center; padding: .5rem; }

/* layar soal */
.exm { max-width: 900px; margin: 0 auto; display: grid; gap: 1rem; }
.exm-top { position: sticky; top: 12px; z-index: 5; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 1.2rem; padding: .8rem 1rem; border-radius: 18px; background: var(--maroon-3); color: var(--cream); box-shadow: var(--shadow-lg); }
.exm-tt { display: grid; line-height: 1.1; }
.exm-tt small { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-l); }
.exm-tt b { font: 400 1.5rem/1.1 var(--f-display); color: #fff; }
.exm-tt b span { font-size: 1rem; color: rgba(251, 245, 236, .55); }
.exm-seg { display: grid; grid-auto-flow: column; gap: .35rem; }
.exm-seg i { height: 8px; border-radius: 99px; background: rgba(251, 245, 236, .15); transition: background .4s; }
.exm-seg i.done { background: var(--gold-l); }
.exm-seg i.cur { background: linear-gradient(90deg, var(--gold-l) 50%, rgba(251, 245, 236, .25) 50%); background-size: 200% 100%; animation: segPulse 1.6s ease-in-out infinite; }
@keyframes segPulse { 50% { background-position: 100% 0; } }
.exm-x { display: inline-flex; align-items: center; gap: .3rem; padding: .45rem .8rem; border-radius: 12px; background: rgba(251, 245, 236, .1); color: var(--cream); text-decoration: none; font-size: .82rem; font-weight: 700; }
.exm-x:hover { background: rgba(251, 245, 236, .2); }
.exm-x .ic { width: .95rem; height: .95rem; }
.exm-card { padding: 1.4rem 1.5rem; border-radius: 22px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-lg); }
.exm-card .q { font-size: 1.15rem; font-weight: 700; color: var(--maroon-2); line-height: 1.45; }
.exm-tag { display: inline-flex; align-items: center; gap: .35rem; padding: .3em .75em; border-radius: 99px; background: var(--gold-s); color: var(--maroon); font: 700 .74rem/1 var(--f-head); text-transform: uppercase; letter-spacing: .08em; }
.exm-tag .ic { width: .85rem; height: .85rem; }
.exm-help { margin-top: 1rem; border-radius: 14px; background: var(--paper); border: 1px dashed rgba(201, 149, 46, .6); }
.exm-help summary { list-style: none; display: flex; align-items: center; gap: .45rem; padding: .7rem .9rem; cursor: pointer; font: 700 .86rem/1.2 var(--f-head); color: var(--maroon); }
.exm-help summary::-webkit-details-marker { display: none; }
.exm-help summary .ic { width: 1rem; height: 1rem; }
.exm-help p { margin: 0; padding: 0 .9rem .8rem 2.35rem; font-size: .88rem; color: var(--muted); }
.exm-foot { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.exm-foot small { color: var(--muted); }
.exm-foot .gbtn[disabled] { opacity: .5; cursor: not-allowed; transform: none; }
.exm-confirm { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 1rem; background: rgba(20, 5, 9, .55); backdrop-filter: blur(3px); animation: fadeIn .2s; }
.exm-confirm[hidden] { display: none; }
@keyframes fadeIn { from { opacity: 0; } }
.exm-cbox { width: min(420px, 100%); display: grid; justify-items: center; gap: .5rem; text-align: center; padding: 1.6rem 1.4rem 1.3rem; border-radius: 22px; background: var(--card); box-shadow: var(--shadow-lg); animation: popIn .3s var(--ease); }
.exm-cic { display: grid; place-items: center; width: 3.2rem; height: 3.2rem; border-radius: 50%; background: var(--gold-s); color: var(--maroon); }
.exm-cic .ic { width: 1.4rem; height: 1.4rem; }
.exm-cbox b { color: var(--maroon-2); font-size: 1.1rem; }
.exm-cbox p { margin: 0; color: var(--muted); font-size: .9rem; }
@media (max-width: 640px) { .exm-top { grid-template-columns: minmax(0, 1fr) auto; } .exm-seg { grid-column: 1 / -1; grid-row: 2; } .exm-x span { display: none; } .exm-card { padding: 1rem; } }

/* hasil */
.exm-res { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2rem; align-items: center; padding: 2rem 2.2rem; }
.exm-res .ring { background: radial-gradient(closest-side, var(--maroon-3) 79%, transparent 80% 100%), conic-gradient(var(--gold-l) calc(var(--p) * 1%), rgba(251, 245, 236, .14) 0); width: 11rem; height: 11rem; }
.exm-res .ring b { color: #fff; font: 400 3.4rem/1 var(--f-display); }
.exm-res .ring small { color: rgba(251, 245, 236, .7); }
.exm-badge { display: inline-flex; align-items: center; gap: .4rem; padding: .35em .9em; border-radius: 99px; font: 800 .8rem/1 var(--f-head); text-transform: uppercase; letter-spacing: .1em; }
.exm-res.pass .exm-badge { background: var(--ok); color: #fff; }
.exm-res.fail .exm-badge { background: rgba(251, 245, 236, .14); color: var(--gold-l); }
.exm-badge .ic { width: 1rem; height: 1rem; }
.exm-res .row-btns { margin-top: 1.1rem; }
@media (max-width: 700px) { .exm-res { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 1.4rem; } .exm-res .row-btns { justify-content: center; } }

/* =========================================================================
   PROGRES: rute pos level, tugas, cap pos, radar, segel
   ========================================================================= */
.prg-hero { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 1.4rem 1.8rem; padding: 1.8rem 2rem 1.2rem; }
.lvring { width: 7.8rem; height: 7.8rem; }
.lvring small { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-l); }
.lvring b { font: 400 3.6rem/1 var(--f-display); color: #fff; }
.prg-t p b { color: var(--gold-l); font-size: 1.15em; }
.rute { grid-column: 1 / -1; position: relative; height: 190px; margin: .4rem .4rem 1.6rem; }
.rute-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.rute-bg { fill: none; stroke: rgba(251, 245, 236, .22); stroke-width: 3; stroke-dasharray: 1.2 1.4; vector-effect: non-scaling-stroke; }
.rute-fg { fill: none; stroke: var(--gold-l); stroke-width: 4; stroke-linecap: round; vector-effect: non-scaling-stroke; stroke-dasharray: var(--pos) 100; animation: ruteIn 1.4s var(--ease) both; }
@keyframes ruteIn { from { stroke-dasharray: 0 100; } }
.pos { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: .35rem; }
.perangko { position: relative; display: grid; place-items: center; width: 3rem; height: 3.4rem; background: var(--cream); color: var(--maroon-2); border-radius: 4px; box-shadow: 0 6px 14px -6px rgba(0, 0, 0, .6); -webkit-mask: radial-gradient(circle 3px at 50% 0, #0000 98%, #000) top / 9px 51% repeat-x, radial-gradient(circle 3px at 50% 100%, #0000 98%, #000) bottom / 9px 51% repeat-x; mask: radial-gradient(circle 3px at 50% 0, #0000 98%, #000) top / 9px 51% repeat-x, radial-gradient(circle 3px at 50% 100%, #0000 98%, #000) bottom / 9px 51% repeat-x; transition: transform .3s cubic-bezier(.3, 1.5, .5, 1); }
.perangko b { font: 400 1.5rem/1 var(--f-display); }
.pos:hover .perangko { transform: rotate(-6deg) scale(1.08); }
.pos.done .perangko { background: var(--gold-l); color: var(--maroon-3); }
.pos.cur .perangko { background: #fff; color: var(--maroon); box-shadow: 0 0 0 4px rgba(226, 176, 74, .5), 0 8px 18px -6px rgba(0, 0, 0, .6); transform: rotate(-4deg) scale(1.12); }
.pos.next .perangko { background: rgba(251, 245, 236, .18); color: rgba(251, 245, 236, .7); }
.cap { position: absolute; right: -10px; top: -8px; display: grid; place-items: center; width: 1.4rem; height: 1.4rem; border-radius: 50%; background: var(--maroon); color: var(--gold-l); border: 2px solid var(--maroon-3); }
.cap .ic { width: .75rem; height: .75rem; stroke-width: 3; }
.pesawat { position: absolute; left: 50%; top: -2.1rem; transform: translateX(-50%) rotate(-12deg); color: var(--gold-l); animation: fly 2.6s ease-in-out infinite; }
.pesawat .ic { width: 1.6rem; height: 1.6rem; stroke-width: 2.2; }
@keyframes fly { 50% { transform: translate(-40%, -5px) rotate(-6deg); } }
.pos-l { display: grid; justify-items: center; text-align: center; line-height: 1.2; white-space: nowrap; }
.pos-l b { font-size: .82rem; color: #fff; }
.pos-l small { font-size: .7rem; color: rgba(251, 245, 236, .6); }
.pos.next .pos-l b { color: rgba(251, 245, 236, .65); }
.prg-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .9rem; }
.prg-k { font: 800 .82rem/1 var(--f-head) !important; letter-spacing: .14em; text-transform: uppercase; color: #c2453b !important; }
.tugas { list-style: none; margin: 0 0 .6rem; padding: 0; display: grid; gap: .55rem; }
.tugas li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: .9rem; padding: .7rem .8rem; border-radius: 16px; background: var(--paper); transition: transform .2s var(--ease); }
.tugas li:hover { transform: translateX(3px); }
.tg-ring { --p: 0; width: 3rem; height: 3rem; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(closest-side, var(--card) 76%, transparent 78% 100%), conic-gradient(var(--gold) calc(var(--p) * 1%), var(--sand) 0); }
.tg-ring b { font: 700 .78rem/1 var(--f-head); color: var(--maroon); }
.tg-ring .ic { width: 1.1rem; height: 1.1rem; color: var(--ok); stroke-width: 3; }
.tg-t { display: grid; }
.tg-t b { color: var(--maroon-2); }
.tg-t small { color: var(--muted); font-size: .8rem; }
.tg-ic { color: var(--gold); }
.tg-ic .ic { width: 1.2rem; height: 1.2rem; }
.tugas li.ok { background: var(--ok-bg); }
.tugas li.ok .tg-ring { background: radial-gradient(closest-side, #fff 76%, transparent 78% 100%), conic-gradient(var(--ok) 100%, var(--sand) 0); }
@keyframes radarIn { from { transform: scale(.2); opacity: 0; } }
@keyframes stampIn { from { transform: scale(1.6) rotate(-20deg); opacity: 0; } }
.segel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: .6rem; }
.segel { display: grid; justify-items: center; gap: .35rem; padding: .5rem .2rem; border: 0; border-radius: 14px; background: none; cursor: pointer; font: inherit; transition: background .2s, transform .2s var(--ease); }
.segel:hover { background: var(--paper); transform: translateY(-2px); }
.segel.sel { background: var(--gold-s); }
.segel small { font: 600 .72rem/1.25 var(--f-head); color: var(--muted); text-align: center; }
.segel.on small { color: var(--maroon-2); }
.seal { position: relative; display: grid; place-items: center; width: 3.4rem; height: 3.4rem; color: rgba(110, 90, 92, .7); background: radial-gradient(circle at 35% 30%, #fff, transparent 45%), #ddd2c6; border-radius: 46% 54% 52% 48% / 50% 46% 54% 50%; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .08), 0 4px 10px -6px rgba(0, 0, 0, .5); }
.seal::after { content: ''; position: absolute; inset: 5px; border-radius: 50%; border: 2px dashed rgba(0, 0, 0, .12); }
.seal .ic { width: 1.35rem; height: 1.35rem; position: relative; z-index: 1; }
.segel.on .seal { color: var(--gold-l); background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, .35), transparent 45%), var(--maroon); --icf: rgba(226, 176, 74, .35); }
.segel.on .seal::after { border-color: rgba(226, 176, 74, .45); }
.segel.on:hover .seal { animation: sealWob .5s ease; }
@keyframes sealWob { 30% { transform: rotate(-10deg) scale(1.08); } 60% { transform: rotate(6deg); } }
.seal.sm { width: 2.8rem; height: 2.8rem; flex: none; }
.segel-info { margin-top: .8rem; padding-top: .8rem; border-top: 1px dashed var(--line); }
.si { display: flex; align-items: center; gap: .9rem; animation: popIn .3s var(--ease); }
.si.on .seal { color: var(--gold-l); background: var(--maroon); }
.si > div { flex: 1; display: grid; gap: .15rem; }
.si b { color: var(--maroon-2); }
.si small { color: var(--muted); font-size: .84rem; }
.si-bar { display: flex; align-items: center; gap: .6rem; margin-top: .3rem; }
.si-bar .bar { flex: 1; }
.si-bar em { font: 700 .78rem/1 var(--f-head); font-style: normal; color: var(--maroon); }
.cert-cta.mini { margin-top: .9rem; }
@media (max-width: 980px) { .prg-grid { grid-template-columns: 1fr; } }
@media (max-width: 700px) {
  .prg-hero { grid-template-columns: 1fr; padding: 1.4rem 1.2rem 1rem; }
  .rute { height: 230px; }
  .pos-l small { display: none; }
  .pos-l b { font-size: .7rem; white-space: normal; max-width: 4.6rem; }
  .perangko { width: 2.4rem; height: 2.8rem; }
}
@media (prefers-reduced-motion: reduce) { .rute-fg, .pesawat, .exm-seg i.cur, .cp-step, .exm-rules li { animation: none; } }
body.settled .cp-step, body.settled .exm-rules li { animation: none; }

/* =========================================================================
   IKON PIKSEL + HALAMAN PANDUAN & LAINNYA
   ========================================================================= */
.pxi { width: 1.05rem; height: 1.05rem; display: block; }
.sb .t-ic .pxi { width: 1.1rem; height: 1.1rem; filter: drop-shadow(1px 1px 0 rgba(0, 0, 0, .22)); }
.sb-sub .t-ic .pxi { width: .95rem; height: .95rem; }
.sb-nav a:hover .t-ic .pxi, .sb-gh:hover .t-ic .pxi { animation: pxJump .45s steps(3) both; }
@keyframes pxJump { 50% { transform: translateY(-2px); } }

/* kepala halaman */
.phx { position: relative; overflow: hidden; display: flex; align-items: center; gap: 1.3rem; padding: 1.5rem 1.7rem; border-radius: 24px; color: var(--cream); background: radial-gradient(rgba(251, 245, 236, .07) 1.2px, transparent 1.4px) 0 0 / 22px 22px, linear-gradient(120deg, var(--maroon-3), var(--maroon-2) 55%, var(--maroon)); box-shadow: var(--shadow-lg); animation: popIn .45s var(--ease); }
.phx::after { content: ''; position: absolute; right: -40px; top: -60px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--tc) 45%, transparent), transparent 70%); pointer-events: none; }
.phx-ic { position: relative; z-index: 1; flex: none; display: grid; place-items: center; width: 4.2rem; height: 4.2rem; border-radius: 18px; background: var(--tc); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .2), 0 10px 20px -10px rgba(0, 0, 0, .6); transform: rotate(-4deg); }
.phx-ic .pxi { width: 2.3rem; height: 2.3rem; filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, .25)); }
.phx:hover .phx-ic { animation: sealWob .6s ease; }
.phx-t { position: relative; z-index: 1; min-width: 0; }
.phx-t small { font: 800 .72rem/1 var(--f-head); letter-spacing: .14em; text-transform: uppercase; color: var(--gold-l); }
.phx-t h1 { margin: .2rem 0 .25rem; font: 400 clamp(2rem, 4vw, 3.1rem)/1 var(--f-display); text-transform: uppercase; color: #fff; letter-spacing: .01em; }
.phx-t p { margin: 0; color: rgba(251, 245, 236, .8); }
.gd-body { display: grid; gap: 1rem; }
.gd-h { margin: .8rem 0 0; font: 800 .82rem/1.2 var(--f-head); letter-spacing: .14em; text-transform: uppercase; color: #c2453b; display: flex; gap: .6rem; align-items: baseline; flex-wrap: wrap; }
.gd-h small { font: 500 .8rem/1 var(--f-body); letter-spacing: 0; text-transform: none; color: var(--muted); }
.gd-lead { margin: 0; color: var(--muted); }
.gd-pager { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; margin-top: .6rem; }
.gd-pager a { display: grid; gap: .35rem; padding: .9rem 1.1rem; border-radius: 18px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); text-decoration: none; transition: transform .25s var(--ease), border-color .25s; }
.gd-pager a:hover { transform: translateY(-3px); border-color: var(--tc); }
.gd-pager a.nx { text-align: right; justify-items: end; }
.gd-pager small { display: inline-flex; align-items: center; gap: .3rem; font: 700 .74rem/1 var(--f-head); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.gd-pager small .ic { width: .85rem; height: .85rem; }
.gd-pager span { display: inline-flex; align-items: center; gap: .6rem; }
.gd-pager span .pxi { width: 1.6rem; height: 1.6rem; padding: .35rem; box-sizing: content-box; border-radius: 10px; background: var(--tc); }
.gd-pager b { color: var(--maroon-2); font-size: 1.05rem; }

/* petunjuk: langkah */
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .8rem; counter-reset: s; }
.steps li { animation: popIn .45s var(--ease) both; animation-delay: calc(var(--i) * 90ms); }
.steps a { position: relative; height: 100%; display: grid; align-content: start; gap: .4rem; padding: 1.1rem 1rem 1rem; border-radius: 20px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); text-decoration: none; color: var(--ink); transition: transform .25s var(--ease), box-shadow .25s; }
.steps a:hover { transform: translateY(-4px) rotate(-.6deg); box-shadow: var(--shadow-lg); }
.st-no { position: absolute; right: 1rem; top: .7rem; font: 400 2.4rem/1 var(--f-display); color: var(--sand); }
.st-ic { display: grid; place-items: center; width: 3rem; height: 3rem; border-radius: 14px; background: var(--maroon); margin-bottom: .3rem; }
.st-ic .pxi { width: 1.6rem; height: 1.6rem; }
.steps b { color: var(--maroon-2); font-size: 1rem; }
.steps small { color: var(--muted); font-size: .84rem; line-height: 1.45; }
@media (max-width: 1000px) { .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* petunjuk: kode interaksi dengan demo */
.kode-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .8rem; }
.kode { display: grid; gap: .25rem; align-content: start; padding: .9rem; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
.kode b { color: var(--maroon-2); }
.kode small { color: var(--muted); font-size: .82rem; line-height: 1.45; }
.kode-demo { display: flex; align-items: center; justify-content: center; gap: .5rem; min-height: 4.4rem; margin-bottom: .4rem; border-radius: 12px; background: radial-gradient(rgba(122, 31, 46, .1) 1px, transparent 1.2px) 0 0 / 12px 12px, var(--paper); overflow: hidden; }
.dm-btn { display: inline-flex; align-items: center; padding: .5rem 1rem; border-radius: 99px; border: 0; background: var(--maroon); color: var(--cream); font: 700 .82rem/1 var(--f-head); cursor: default; }
button.dm-btn { cursor: pointer; }
.dm-hover { transition: transform .2s var(--ease), background .2s, box-shadow .2s; cursor: pointer; }
.dm-hover:hover { background: var(--maroon-2); transform: translateY(-2px); box-shadow: 0 0 0 4px var(--gold-s); }
.dm-hit.pop { animation: hitPop .45s cubic-bezier(.3, 1.6, .5, 1); background: var(--ok); }
@keyframes hitPop { 40% { transform: scale(1.15); } }
.dm-swipe { display: flex; gap: .4rem; overflow-x: auto; padding: .5rem; max-width: 100%; scroll-snap-type: x mandatory; scrollbar-width: none; }
.dm-swipe span { flex: none; scroll-snap-align: start; padding: .45rem .8rem; border-radius: 10px; background: #fff; border: 1.5px solid var(--line); font: 700 .78rem/1 var(--f-head); color: var(--maroon-2); }
.dm-drag { display: flex; align-items: center; gap: .6rem; }
.dm-chip { padding: .45rem .8rem; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; font: 700 .78rem/1 var(--f-head); color: var(--maroon-2); cursor: pointer; transition: transform .2s var(--ease), box-shadow .2s; }
.dm-chip.picked { transform: translateY(-3px) rotate(-3deg); box-shadow: 0 0 0 3px var(--gold-l); }
.dm-slot { display: inline-grid; place-items: center; min-width: 5.5rem; min-height: 2.2rem; border-radius: 10px; border: 1.5px dashed rgba(201, 149, 46, .8); font-size: .72rem; color: var(--muted); cursor: pointer; }
.dm-slot.full { border-style: solid; background: var(--ok-bg); font-size: 0; }
.dm-show { font-size: .8rem; color: var(--ok); font-weight: 700; animation: popIn .3s var(--ease); }
@media (max-width: 900px) { .kode-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .kode-grid, .steps { grid-template-columns: 1fr; } }

/* tujuan */
.goal-q { margin: 0; padding: 1.3rem 1.5rem; border-radius: 20px; background: var(--gold-s); border-left: 6px solid var(--gold); }
.goal-q small { font: 800 .72rem/1 var(--f-head); letter-spacing: .14em; text-transform: uppercase; color: var(--maroon); }
.goal-q p { margin: .4rem 0 0; font: 600 clamp(1.05rem, 1.6vw, 1.3rem)/1.5 var(--f-head); color: var(--maroon-3); }
.goal-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: .6rem; }
.goal-grid li { display: flex; gap: .7rem; align-items: flex-start; padding: .8rem .9rem; border-radius: 16px; background: var(--card); border: 1px solid var(--line); font-size: .9rem; line-height: 1.45; animation: popIn .4s var(--ease) both; animation-delay: calc(var(--i) * 60ms); }
.goal-grid li span { flex: none; display: grid; place-items: center; width: 1.8rem; height: 1.8rem; border-radius: 9px; background: var(--maroon); color: var(--gold-l); font: 400 1rem/1 var(--f-display); }
.goal-groups { display: grid; gap: .6rem; }
.gg { border-radius: 18px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden; }

const KEY = 'smart-emailing:v2';
const fresh = () => ({ done: {}, act: {}, lat: null, akt: null, ev: null, feedback: null, sound: true, last: null, v2: true, log: [], resume: null, ui: {} });
let state = (() => { try { return Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { return fresh(); } })();
/* Migrasi ID lama (S01–S16) ke ID bernama, supaya progres peserta lama tetap terbaca */
const ID_LAMA = { S01: 'pengantar', S02: 'kegunaan-email', S03: 'bagian-email', S04: 'subject-dan-salam', S05: 'susunan-email', S06: 'perkenalan-dan-cv', S07: 'kesalahan-email', S08: 'praktik-email', S09: 'cc-bcc-waktu', S10: 'follow-up', S11: 'bahasa-formal', S12: 'latihan-soal', S13: 'aktivitas-interaktif', S14: 'awal-evaluasi', S15: 'evaluasi-akhir', S16: 'penutup' };
(() => {
  ['done', 'act'].forEach(k => { const o = state[k]; if (!o) return; Object.keys(ID_LAMA).forEach(old => { if (old in o) { if (!(ID_LAMA[old] in o)) o[ID_LAMA[old]] = o[old]; delete o[old]; } }); });
  if (state.last && ID_LAMA[state.last]) state.last = ID_LAMA[state.last];
  if (state.resume) { if (state.resume.id && ID_LAMA[state.resume.id]) state.resume.id = ID_LAMA[state.resume.id]; if (state.resume.kind === 'scene') state.resume.kind = 'bagian'; if (state.resume.href) state.resume.href = state.resume.href.replace(/#\/scene\/(S\d\d)/, (m, id) => '#/bagian/' + (ID_LAMA[id] || id)); }
  (state.log || []).forEach(e => { if (e.id && ID_LAMA[e.id]) e.id = ID_LAMA[e.id]; });
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* mode privat */ }
})();
let gameOn = false;
function save() { if (gameOn) gameCheck(); try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* mode privat */ } SCORM.sync(); }

/* ---------- Koneksi LMS (SCORM 1.2) ----------
   Bila dibuka di dalam LMS, status belajar dan nilai evaluasi dikirim ke LMS.
   Bila dibuka biasa (offline / GitHub Pages), bagian ini diam saja. */
const SCORM = (() => {
  let api = null, last = '';
  try {
    let w = window;
    for (let i = 0; i < 12 && w; i++) { if (w.API) { api = w.API; break; } if (w === w.parent) break; w = w.parent; }
    if (!api && window.opener && window.opener.API) api = window.opener.API;
    if (api && String(api.LMSInitialize('')) !== 'true') api = null;
  } catch (e) { api = null; }
  const set = (k, v) => { try { api.LMSSetValue(k, String(v)); } catch (e) { /* abaikan */ } };
  if (api) window.addEventListener('beforeunload', () => { try { api.LMSCommit(''); api.LMSFinish(''); } catch (e) { /* abaikan */ } });
  return {
    on: !!api,
    sync() {
      if (!api) return;
      const ev = state.ev && state.ev.done ? state.ev.score : null;
      const status = ev === null ? 'incomplete' : ev >= KKM ? 'passed' : 'failed';
      const key = status + '|' + ev + '|' + (state.last || '');
      if (key === last) return; last = key;
      set('cmi.core.lesson_status', status);
      if (ev !== null) { set('cmi.core.score.min', 0); set('cmi.core.score.max', 100); set('cmi.core.score.raw', ev); }
      if (state.last) set('cmi.core.lesson_location', state.last);
      try { api.LMSCommit(''); } catch (e) { /* abaikan */ }
    },
  };
})();
const A = id => (state.act[id] = state.act[id] || {});
/* Migrasi ke storyboard v2: latihan jadi 15 soal PG, evaluasi jadi 4 soal, penutup pindah ke penutup */
if (state.lat && state.lat.v !== 3) state.lat = null;
if (state.ev && state.ev.v !== 3) state.ev = null;
if (!state.v2) { delete state.done['latihan-soal']; delete state.done['aktivitas-interaktif']; delete state.act['latihan-soal']; delete state.act['aktivitas-interaktif']; state.v2 = true; }

/* ---------- Suara ---------- */
let actx;
function sfx(type = 'click') {
  if (!state.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    const c = { click: [700, 700, .05, 'sine'], ok: [740, 1180, .2, 'sine'], hint: [560, 900, .16, 'sine'], no: [260, 150, .24, 'triangle'] }[type];
    o.type = c[3]; o.frequency.setValueAtTime(c[0], t); o.frequency.linearRampToValueAtTime(c[1], t + c[2]);
    g.gain.setValueAtTime(.07, t); g.gain.exponentialRampToValueAtTime(.0001, t + c[2] + .05);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + c[2] + .08);
  } catch (e) { /* tidak ada audio */ }
}
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
function celebrate() {
  if (document.body.classList.contains('calm')) return;
  if (reduced) return;
  const box = document.createElement('div'); box.className = 'confetti';
  const colors = ['#7a1f2e', '#e2b04a', '#f4d9cf', '#c4553f', '#fbf5ec', '#3b1119'];
  for (let i = 0; i < 44; i++) {
    const s = document.createElement('i');
    s.style.cssText = `--dx:${((Math.random() - .5) * 520).toFixed(0)}px;--dy:${-(160 + Math.random() * 240).toFixed(0)}px;--r:${(Math.random() * 720 - 360).toFixed(0)}deg;background:${colors[i % colors.length]};animation-delay:${(Math.random() * 140).toFixed(0)}ms;width:${(6 + Math.random() * 6).toFixed(0)}px;height:${(10 + Math.random() * 8).toFixed(0)}px`;
    box.appendChild(s);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 2000);
}

/* ---------- Status kunci ---------- */
const materiDone = () => MATERI_BAGIAN.every(id => state.done[id]);
const evalPassed = () => !!(state.ev && state.ev.done && state.ev.score >= KKM);
const LAT_MIN = 11; /* syarat evaluasi: latihan PG minimal 70% (11 dari 15 benar) */
const AKT_KEYS = ['a', 'b', 'c'];
const aktDone = () => AKT_KEYS.every(k => !!(state.akt && state.akt[k] && state.akt[k].done));
const latSkor = () => state.lat ? Object.values(state.lat.res || {}).filter(Boolean).length : 0;
const gateOk = () => materiDone() && latSkor() >= LAT_MIN && aktDone();
/* Kunci berurutan: setiap bagian baru terbuka setelah bagian sebelumnya selesai (dibaca + aktivitasnya dikerjakan) */
const locked = id => {
  if (id === 'awal-evaluasi') return !materiDone();
  if (id === 'evaluasi-akhir') return !gateOk();
  if (id === 'penutup') return !evalPassed();
  const i = ORDER.indexOf(id);
  return i > 0 && !state.done[ORDER[i - 1]];
};
const readAll = id => { const s = BAGIAN[id]; if (!s.uraian) return true; const r = A(id).read || []; return s.uraian.every((_, j) => r.includes(j)); };
const doneCount = () => ORDER.filter(id => state.done[id]).length;
const pct = () => Math.round(doneCount() / ORDER.length * 100);
const nextOf = id => id === 'penutup' ? null : '#/bagian/' + ORDER[ORDER.indexOf(id) + 1];
const prevOf = id => ORDER.indexOf(id) > 0 ? '#/bagian/' + ORDER[ORDER.indexOf(id) - 1] : '#/materi';
const resumeHref = () => {
  const id = ORDER.slice(0, 13).find(x => !state.done[x]);
  if (id) return '#/bagian/' + id;
  return '#/bagian/' + (!gateOk() ? 'awal-evaluasi' : !evalPassed() ? 'evaluasi-akhir' : 'penutup');
};

function showFb(fb, ok, msg) {
  fb.hidden = false;
  fb.className = 'fb ' + (ok === true ? 'fb-ok' : ok === false ? 'fb-no' : 'fb-info');
  fb.innerHTML = `${icon(ok === true ? 'check' : ok === false ? 'x' : 'bulb')}<span>${msg}</span>`;
}
const actHead = (ic, label, counter = '') => `<div class="act-head"><span class="act-tag">${icon(ic)} ${label}</span>${counter ? `<span class="counter">${counter}</span>` : ''}</div>`;

/* Pilihan ganda dengan umpan balik; riwayat pilihan disimpan supaya tidak mengulang */
function mcq(el, { q, opts, onDone, store, key }) {
  el.innerHTML = `${q ? `<p class="q">${q}</p>` : ''}
    <div class="opts">${opts.map((o, i) => `<button type="button" class="opt" data-i="${i}"><span class="opt-l">${'ABCD'[i]}</span><span class="opt-t">${o.t}</span></button>`).join('')}</div>
    <div class="fb" hidden></div>`;
  const fb = $('.fb', el), rec = store ? (store[key] = store[key] || []) : [];
  const pick = (i, silent) => {
    const o = opts[i], b = $(`.opt[data-i="${i}"]`, el);
    showFb(fb, !!o.ok, o.fb);
    if (o.ok) { b.classList.add('ok'); $$('.opt', el).forEach(x => (x.disabled = true)); silent || sfx('ok'); onDone && onDone(silent); }
    else { b.classList.add('no'); b.disabled = true; silent || sfx('no'); }
  };
  rec.forEach(i => pick(i, true));
  el.onclick = e => {
    const b = e.target.closest('.opt'); if (!b || b.disabled) return;
    rec.push(+b.dataset.i); save(); pick(+b.dataset.i, false);
  };
}

   ========================================================================= */
/* Rute belajar: jalur bagian pengantar–penutup di atas halaman (pengganti sidebar) */
function routeRail(cur) {
  const groups = MATERI.map(m => [m.short, m.bagian]);
  const isDone = id => !!state.done[id];
  const isLock = locked;
  const total = ORDER.length, n = doneCount(), p = Math.round(n / total * 100);
  const res = resumeHref(), resId = (res.split('/').pop() || '');
  let prevFull = true, k = 0;
  const grp = ([label, ids]) => {
    const d = ids.filter(isDone).length, full = d === ids.length, anyOpen = ids.some(id => !isLock(id));
    /* garis terisi sampai titik pertama yang belum selesai di kelompok yang sedang berjalan */
    const fill = full ? 100 : (d || prevFull) && anyOpen ? (d + .5) / ids.length * 100 : 0;
    prevFull = full;
    const st = full ? 'full' : anyOpen ? 'go' : 'lock';
    return `<div class="r2-grp ${st}" style="--n:${ids.length}">
      <div class="r2-gh"><b>${label}</b><span>${full ? icon('check') : st === 'lock' ? icon('lock') : ''}${d}/${ids.length}</span></div>
      <div class="r2-stops" style="--fill:${fill.toFixed(1)}%">${ids.map(id => {
        const dn = isDone(id), lk = isLock(id), c = id === cur;
        const cls = c ? 'cur' : dn ? 'done' : lk ? 'locked' : 'open';
        const t = BAGIAN[id].title;
        return `<a class="r2-stop ${cls} ${dn ? 'is-done' : ''}" style="--i:${k++}" href="#/bagian/${id}" data-peek="${id}" aria-label="${t}${dn ? ' (selesai)' : lk ? ' (terkunci)' : ''}"${c ? ' aria-current="step"' : ''}>
          <span class="r2-dot">${dn && !c ? icon('check') : lk ? icon('lock') : icon((materiOf(id) || {}).icon || 'book')}</span>
          <span class="r2-lbl">${c ? 'Di sini' : ''}</span></a>`;
      }).join('')}</div></div>`;
  };
  return `<nav class="rail r2" aria-label="Rute belajar">
    <div class="r2-head">
      <span class="rail-ic">${icon('map')}</span>
      <div class="r2-tt"><b>Rute Belajar</b><small><b>${n}</b> dari ${total} bagian selesai</small></div>
      <div class="r2-prog" title="${p}% selesai"><span class="r2-bar"><i style="width:${p}%"></i></span><b>${p}%</b></div>
      <div class="r2-act">${resId && resId !== cur && !isLock(resId) ? `<a class="r2-go" href="${res}">${icon('right')} Lanjutkan belajar</a>` : ''}<a class="rail-all" href="#/materi">${icon('grid')}<span>Semua materi</span></a></div>
    </div>
    <div class="r2-track">${groups.map(grp).join('')}</div>
  </nav>`;
}

      <p class="pk-d">${p.desc}</p>${p.st === 'lock' ? `<div class="pk-why">${icon('lock')} ${p.why}</div>` : ''}`;
    el.classList.add('show');
    const r = t.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight, gap = 10, pad = 8;
    let x = r.left + r.width / 2 - w / 2;
    x = Math.max(pad, Math.min(x, innerWidth - w - pad));
    let y = r.bottom + gap, below = true;
    if (y + h > innerHeight - pad) { y = r.top - gap - h; below = false; }
    if (y < pad) { y = pad; }
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.setProperty('--ax', Math.max(14, Math.min(w - 14, r.left + r.width / 2 - x)) + 'px');
    el.classList.toggle('up', !below);
  };
  document.addEventListener('mouseover', e => { if (matchMedia('(hover: none)').matches) return; const t = e.target.closest('[data-peek]'); if (t && t !== cur) show(t); else if (!t && cur) hide(); });
  document.addEventListener('focusin', e => { const t = e.target.closest('[data-peek]'); if (t) show(t); else hide(); });
  document.addEventListener('focusout', e => { if (e.target.closest('[data-peek]')) hide(); });
  addEventListener('scroll', hide, true); addEventListener('hashchange', hide); addEventListener('resize', hide);
})();

const HINT_AKT = {

};
function hintFor(id) {
  const s = BAGIAN[id], st = A(id), nx = ORDER[ORDER.indexOf(id) + 1];
  const sisa = s.uraian ? s.uraian.length - s.uraian.filter((_, j) => (st.read || []).includes(j)).length : 0;
  if (state.done[id]) return { t: `Bagian ini sudah selesai. Klik <b>Lanjut</b> untuk membuka ${nx === 'latihan-soal' ? 'langkah berikutnya' : 'bagian ' + BAGIAN[nx].title}.`, to: '#nextBtn' };
  if (!st.actOk && (readAll(id) || s.uraianAfter)) return { t: `${readAll(id) ? 'Materinya sudah kebaca semua. ' : ''}Sekarang giliran aktivitas di bawah: ${HINT_AKT[id] || 'selesaikan aktivitasnya.'}`, to: '#activity' };
  if (!st.actOk) return { t: `Masih ada <b>${sisa} kartu materi</b> yang belum dibaca. Klik <b>Berikutnya</b> di kartu materi, setelah itu kerjakan aktivitasnya.`, to: '#uraian .st-tab:not(.read)' };
  return { t: `Tinggal satu langkah lagi: buka <b>${sisa} kartu materi</b> yang belum dibaca supaya bagian berikutnya terbuka.`, to: '#uraian .st-tab:not(.read)' };
}
function hintCoach(id) {
  const FIRST = 30000, NEXT = 60000;
  let timer = 0, wait = FIRST, box = null, last = 0;
  const close = () => { if (!box) return; const b = box; box = null; b.classList.remove('show'); setTimeout(() => b.remove(), 300); };
  const arm = () => { clearTimeout(timer); timer = setTimeout(pop, wait); };
  const pop = () => {
    if (document.hidden || !document.body.contains($('#activity'))) { arm(); return; }
    const h = hintFor(id);
    close();
    box = document.createElement('div');
    box.className = 'hint'; box.setAttribute('role', 'status');
    box.innerHTML = `<span class="hint-ic">${icon('bulb')}</span>
      <div class="hint-b"><small>Petunjuk</small><p>${h.t}</p>
        <div class="hint-btns"><button type="button" class="btn btn-gold btn-sm" data-show>${icon('pointer')} Tunjukkan</button><button type="button" class="hint-x" data-x aria-label="Tutup petunjuk">Nanti saja</button></div></div>`;
    document.body.appendChild(box); sfx('hint');
    requestAnimationFrame(() => box && box.classList.add('show'));
    box.onclick = e => {
      if (e.target.closest('[data-show]')) {
        const t = $(h.to);
        if (t) { t.scrollIntoView({ behavior: 'smooth', block: 'center' }); t.classList.remove('hint-spot'); void t.offsetWidth; t.classList.add('hint-spot'); setTimeout(() => t.classList.remove('hint-spot'), 2600); }
        sfx(); close(); wait = NEXT; arm();
      } else if (e.target.closest('[data-x]')) { close(); wait = NEXT; arm(); }
    };
  };
  /* setiap gerakan peserta dianggap aktif: hitungan diam diulang dari nol */
  const busy = e => {
    if (box && box.contains(e.target)) return;
    const now = Date.now(); if (e.type === 'scroll' && now - last < 400) return; last = now;
    if (box) { close(); wait = NEXT; }
    arm();
  };
  const evs = ['pointerdown', 'keydown', 'scroll', 'touchstart'];
  evs.forEach(ev => addEventListener(ev, busy, { passive: true, capture: true }));
  arm();
  onLeave(() => { clearTimeout(timer); evs.forEach(ev => removeEventListener(ev, busy, { capture: true })); close(); });
}

    ${st.placed.length ? `<button type="button" class="btn btn-outline btn-sm" data-reset>${icon('refresh')} Ulangi dari awal</button>` : ''}`;
    if (st.placed.length === 5) { showFb($('.fb', el), true, 'Pas! Urutan emailmu sudah rapi dan profesional.'); }
  };
  const tryPlace = (k, slot) => {
    if (!slot || slot.classList.contains('filled')) return;
    const i = +slot.dataset.i;
    if (parts[i][0] === k) {
      st.placed.push(k); save(); sfx('ok'); build();
      if (st.placed.length === 5) done(false); else showFb($('.fb', el), true, `Benar, slot ${i + 1} adalah ${parts[i][1].toLowerCase()}.`);
    } else {
      sfx('no'); slot.classList.remove('shake'); void slot.offsetWidth; slot.classList.add('shake');
      $$('.dcard', el).forEach(c => c.classList.remove('sel')); selected = null;
      showFb($('.fb', el), false, 'Belum pas. Ingat lagi, bagian mana yang pertama kali dilihat penerima?');
    }
  };
  build();
  if (st.placed.length === 5) done(true);
  el.addEventListener('click', e => {
    if (e.target.closest('[data-reset]')) { st.placed = []; st.order = null; save(); build(); return; }
    const c = e.target.closest('.dcard');
    if (c) { const on = !c.classList.contains('sel'); $$('.dcard', el).forEach(x => x.classList.remove('sel')); c.classList.toggle('sel', on); selected = on ? c.dataset.k : null; sfx(); return; }
    const s = e.target.closest('.slot');
    if (s && selected) tryPlace(selected, s); else if (s && !s.classList.contains('filled')) toast('Pilih kartunya dulu, lalu ketuk slotnya.');
  });
  el.addEventListener('keydown', e => { const s = e.target.closest('.slot'); if (s && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); s.click(); } });
  el.addEventListener('dragstart', e => { const c = e.target.closest('.dcard'); if (c) { e.dataTransfer.setData('text/plain', c.dataset.k); c.classList.add('dragging'); } });
  el.addEventListener('dragend', e => { const c = e.target.closest('.dcard'); c && c.classList.remove('dragging'); });
  el.addEventListener('dragover', e => { const s = e.target.closest('.slot'); if (s && !s.classList.contains('filled')) { e.preventDefault(); s.classList.add('over'); } });
  el.addEventListener('dragleave', e => { const s = e.target.closest('.slot'); s && s.classList.remove('over'); });
  el.addEventListener('drop', e => { const s = e.target.closest('.slot'); if (s) { e.preventDefault(); s.classList.remove('over'); tryPlace(e.dataTransfer.getData('text/plain'), s); } });
};
